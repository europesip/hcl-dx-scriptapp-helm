# TechDocs of the Script Application Helm chart (and Hello DX): the docs/ folder, shown in the EUROPESIP Internal
# Developer Portal (Backstage) through the annotation backstage.io/techdocs-ref of its catalog entity. Build locally
# (same as Backstage):
#   pip install mkdocs-techdocs-core==1.7.1 && mkdocs serve
site_name: Script Applications for HCL DX, deployed with Helm
site_description: Helm chart that pushes an HCL DX Script Application with DXClient, and Hello DX, a sample React Script Application (not HCL software)
repo_url: https://github.com/europesip/hcl-dx-scriptapp-helm
edit_uri: edit/main/docs/
docs_dir: docs

plugins:
  - techdocs-core

nav:
  - Overview: index.md
  - Español:
      - Introducción: index.es.md

# Heading anchors as GitHub makes them (accents kept: #instalación), so the same links work on GitHub and here
markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
